<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Comic Uploader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="password"], input[type="file"] {
            width: 100%; padding: 10px; box-sizing: border-box;
            background: #222; border: 1px solid #444; color: #fff; border-radius: 4px;
        }
        button {
            width: 100%; padding: 12px; background-color: #2ea043; color: white;
            border: none; border-radius: 4px; font-size: 16px; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        button:hover { background-color: #2c974b; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #log {
            margin-top: 20px; background: #0d1117; padding: 15px;
            height: 300px; overflow-y: auto; font-family: monospace;
            border: 1px solid #30363d; border-radius: 4px; font-size: 13px;
        }
        .success { color: #3fb950; }
        .error { color: #f85149; }
        .info { color: #58a6ff; }
    </style>
</head>
<body>

    <h2>Comic Uploader for GitHub</h2>

    <div class="input-group">
        <label for="pat">GitHub Personal Access Token (PAT)</label>
        <input type="password" id="pat" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>

    <div class="input-group">
        <label for="folderInput">Select Main Folder</label>
        <!-- webkitdirectory property allows selecting folders with subfolders -->
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </div>

    <button id="uploadBtn">Start Upload</button>

    <div id="log">Logs will appear here...<br><br></div>

    <script>
        const repoOwner = "maxton480";
        const repoName = "comics";
        
        const logDiv = document.getElementById('log');
        const uploadBtn = document.getElementById('uploadBtn');

        function addLog(msg, type = "info") {
            const span = document.createElement('div');
            span.className = type;
            span.textContent = msg;
            logDiv.appendChild(span);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); // Only keep base64 string
                reader.onerror = error => reject(error);
            });
        }

        uploadBtn.addEventListener('click', async () => {
            const pat = document.getElementById('pat').value.trim();
            const files = document.getElementById('folderInput').files;

            if (!pat) {
                addLog("Error: Please enter your GitHub Token.", "error");
                return;
            }
            if (files.length === 0) {
                addLog("Error: Please select a folder first.", "error");
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = "Uploading... Do not close window";
            addLog(`Found ${files.length} files. Starting upload process...`);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                // webkitRelativePath contains the structure (e.g., "MainFolderName/ch1/img.jpg")
                const filePath = file.webkitRelativePath; 
                
                if (!filePath || file.name.startsWith('.')) continue; // Ignore hidden system files

                addLog(`[${i+1}/${files.length}] Converting ${filePath}...`, "info");
                
                try {
                    const contentBase64 = await toBase64(file);
                    
                    const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${pat}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify({
                            message: `Add ${filePath} via Web Tool`,
                            content: contentBase64
                        })
                    });

                    if (response.status === 201 || response.status === 200) {
                        addLog(`Success: Uploaded ${filePath}`, "success");
                    } else if (response.status === 422) {
                        addLog(`Skipped: ${filePath} (File already exists or invalid data)`, "info");
                    } else {
                        const err = await response.json();
                        addLog(`Failed: ${filePath} - ${err.message}`, "error");
                    }
                    
                    // Delay of 500ms between uploads so GitHub API rate limit hit na ho
                    await new Promise(r => setTimeout(r, 500)); 

                } catch (error) {
                    addLog(`Error uploading ${filePath}: ${error.message}`, "error");
                }
            }

            addLog("Upload complete!", "success");
            uploadBtn.disabled = false;
            uploadBtn.textContent = "Start Upload";
        });
    </script>
</body>
</html>
