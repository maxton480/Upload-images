<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comic Uploader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14121f; --panel:#1d1a2e; --panel2:#262240; --line:#3a3560;
  --text:#ece9f7; --mute:#9d98bd; --pop:#ffd23f; --ok:#4ade80; --err:#ff5d6c; --info:#7cc4ff;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:24px 16px 48px;
  font-family:'DM Sans',system-ui,sans-serif; color:var(--text); background:var(--ink);
  background-image:radial-gradient(rgba(255,210,63,.07) 1.2px,transparent 1.4px);
  background-size:16px 16px;
}
.wrap{max-width:640px;margin:0 auto}
h1{
  font-family:'Bangers',Impact,sans-serif; font-weight:400; letter-spacing:2px;
  font-size:clamp(40px,11vw,64px); line-height:1; margin:8px 0 6px;
  color:var(--pop); text-shadow:4px 4px 0 #000; transform:rotate(-1.5deg);
}
.sub{color:var(--mute);margin:0 0 24px}
.card{
  background:var(--panel); border:3px solid #000; border-radius:6px;
  box-shadow:6px 6px 0 #000; padding:18px; margin-bottom:20px;
}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:14px}
input[type=text],input[type=password]{
  width:100%;padding:11px 12px;background:var(--ink);color:var(--text);
  border:2px solid var(--line);border-radius:6px;font:inherit;
}
input:focus-visible,button:focus-visible,.drop:focus-within{outline:3px solid var(--pop);outline-offset:2px}
.pw{position:relative}
.pw button{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;
  padding:6px 10px;font-size:13px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);box-shadow:none;
}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-top:8px;font-weight:400}
.check input{accent-color:var(--pop);width:18px;height:18px}
.drop{
  position:relative;display:block;text-align:center;padding:28px 12px;cursor:pointer;
  border:3px dashed var(--line);border-radius:6px;background:var(--ink);transition:.2s;
}
.drop:hover{border-color:var(--pop);background:var(--panel2)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop b{display:block;font-family:'Bangers',Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:1px}
.drop span{color:var(--mute);font-size:14px}
#picked{margin-top:10px;font-size:14px;color:var(--pop);min-height:20px}
button.go{
  width:100%;padding:14px;margin-top:16px;cursor:pointer;
  font-family:'Bangers',Impact,sans-serif;font-size:26px;letter-spacing:2px;
  background:var(--pop);color:#000;border:3px solid #000;border-radius:6px;box-shadow:5px 5px 0 #000;
  transition:transform .1s,box-shadow .1s;
}
button.go:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #000}
button.go:disabled{background:#4b4770;color:#aaa;cursor:not-allowed}
.bar{height:22px;background:var(--ink);border:3px solid #000;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pop) 0 10px,#ffbe0b 10px 20px);transition:width .2s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stats div{background:var(--ink);border:2px solid var(--line);border-radius:6px;padding:8px 4px}
.stats b{display:block;font-size:18px}
.stats small{color:var(--mute)}
#log{
  height:240px;overflow-y:auto;background:#0b0a14;border:2px solid var(--line);border-radius:6px;
  padding:10px;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;
}
.success{color:var(--ok)} .error{color:var(--err)} .info{color:var(--info)}
.note{font-size:12.5px;color:var(--mute);margin:10px 0 0}
@media (max-width:480px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Comic Uploader</h1>
  <p class="sub">Pick a folder, upload it to GitHub in a single commit.</p>

  <div class="card">
    <div class="field">
      <label for="pat">GitHub token (PAT)</label>
      <div class="pw">
        <input type="password" id="pat" placeholder="ghp_… or github_pat_…" autocomplete="off">
        <button type="button" id="toggle">Show</button>
      </div>
      <label class="check"><input type="checkbox" id="remember" checked> Remember token on this device</label>
    </div>
    <div class="row">
      <div class="field"><label for="owner">Owner</label><input type="text" id="owner" value="maxton480"></div>
      <div class="field"><label for="repo">Repository</label><input type="text" id="repo" value="comics"></div>
    </div>
    <div class="row">
      <div class="field"><label for="branch">Branch (blank = default)</label><input type="text" id="branch" placeholder="main"></div>
      <div class="field"><label for="prefix">Upload into folder (optional)</label><input type="text" id="prefix" placeholder="e.g. solo-leveling"></div>
    </div>
    <p class="note">Tip: use a fine-grained token limited to this one repo, with Contents set to read and write. The token is saved only in this browser’s local storage.</p>
  </div>

  <div class="card">
    <label class="drop">
      <b>Choose comic folder</b>
      <span>Subfolders and images are included</span>
      <input type="file" id="folderInput" webkitdirectory directory multiple>
    </label>
    <div id="picked"></div>
    <button class="go" id="uploadBtn">Start upload</button>
  </div>

  <div class="card" id="progressCard" hidden>
    <label>Progress</label>
    <div class="bar"><i id="fill"></i></div>
    <div class="stats">
      <div><b id="sFiles">0/0</b><small>files</small></div>
      <div><b id="sSize">0 MB</b><small>uploaded</small></div>
      <div><b id="sSpeed">0 MB/s</b><small>speed</small></div>
    </div>
  </div>

  <div class="card"><div id="log">Logs will appear here…</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const CONCURRENCY = 6;
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};

// Restore saved settings
['owner','repo','branch','prefix'].forEach(k => { const v = store.get('cu_'+k); if (v !== null) $(k).value = v; });
const savedPat = store.get('cu_pat');
if (savedPat) $('pat').value = savedPat;
$('remember').checked = store.get('cu_remember') !== '0';

$('toggle').onclick = () => {
  const show = $('pat').type === 'password';
  $('pat').type = show ? 'text' : 'password';
  $('toggle').textContent = show ? 'Hide' : 'Show';
};

function saveSettings(){
  ['owner','repo','branch','prefix'].forEach(k => store.set('cu_'+k, $(k).value.trim()));
  store.set('cu_remember', $('remember').checked ? '1' : '0');
  if ($('remember').checked) store.set('cu_pat', $('pat').value.trim()); else store.del('cu_pat');
}

function log(msg, type='info'){
  const d = document.createElement('div');
  d.className = type; d.textContent = msg;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
}
const fmtMB = b => (b/1048576).toFixed(b < 10485760 ? 2 : 1) + ' MB';
const sleep = ms => new Promise(r => setTimeout(r, ms));

$('folderInput').onchange = e => {
  const f = [...e.target.files].filter(x => !x.name.startsWith('.'));
  const size = f.reduce((a,x) => a + x.size, 0);
  $('picked').textContent = f.length ? `${f.length} files selected (${fmtMB(size)})` : '';
};

// GitHub API call with retry on rate limits / server errors
async function gh(pat, path, opts = {}, tries = 4){
  for (let t = 0; t < tries; t++){
    let res;
    try{
      res = await fetch('https://api.github.com' + path, {
        ...opts,
        headers: {
          'Authorization': `Bearer ${pat}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        }
      });
    }catch(e){ if (t === tries-1) throw e; await sleep(1000*(t+1)); continue; }
    if (res.ok) return res.json();
    const retryable = res.status >= 500 || res.status === 429 || (res.status === 403 && res.headers.get('retry-after'));
    if (retryable && t < tries-1){
      const wait = (parseInt(res.headers.get('retry-after')) || 2*(t+1)) * 1000;
      await sleep(wait); continue;
    }
    let msg = res.statusText;
    try{ const j = await res.json(); msg = j.message + (j.errors ? ' ' + JSON.stringify(j.errors) : ''); }catch(e){}
    const err = new Error(`${res.status}: ${msg}`); err.status = res.status; throw err;
  }
}

// Git blob SHA-1 (lets us skip files that are already uploaded)
async function gitSha(buf){
  const head = new TextEncoder().encode(`blob ${buf.byteLength}\0`);
  const all = new Uint8Array(head.length + buf.byteLength);
  all.set(head); all.set(new Uint8Array(buf), head.length);
  const h = await crypto.subtle.digest('SHA-1', all);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function toBase64(buf){
  const bytes = new Uint8Array(buf); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

$('uploadBtn').onclick = async () => {
  const pat = $('pat').value.trim();
  const owner = $('owner').value.trim(), repo = $('repo').value.trim();
  const prefix = $('prefix').value.trim().replace(/^\/+|\/+$/g, '');
  const files = [...$('folderInput').files].filter(f => !f.name.startsWith('.') && f.name !== 'Thumbs.db');

  if (!pat) return log('Enter your GitHub token first.', 'error');
  if (!owner || !repo) return log('Owner and repository are required.', 'error');
  if (!files.length) return log('Choose a folder first.', 'error');

  saveSettings();
  $('uploadBtn').disabled = true; $('uploadBtn').textContent = 'Uploading… keep this tab open';
  $('progressCard').hidden = false;
  $('fill').style.width = '0%';

  const base = `/repos/${owner}/${repo}`;
  let step = '';
  try{
    // 1. Find branch + latest commit + existing files
    let branch = $('branch').value.trim();
    if (!branch){ branch = (await gh(pat, base)).default_branch; }
    log(`Target: ${owner}/${repo} (${branch})`);
    const ref = await gh(pat, `${base}/git/ref/heads/${encodeURIComponent(branch)}`);
    const parentSha = ref.object.sha;
    const parent = await gh(pat, `${base}/git/commits/${parentSha}`);
    const existing = new Map();
    try{
      const tree = await gh(pat, `${base}/git/trees/${parent.tree.sha}?recursive=1`);
      tree.tree.forEach(n => { if (n.type === 'blob') existing.set(n.path, n.sha); });
    }catch(e){ log('Could not read existing files; uploading everything.', 'info'); }

    // 2. Upload blobs in parallel
    const total = files.length;
    const totalBytes = files.reduce((a,f) => a + f.size, 0);
    let done = 0, doneBytes = 0, uploaded = 0, skipped = 0, failed = 0;
    const entries = [];
    const t0 = performance.now();
    let idx = 0;

    const render = () => {
      $('fill').style.width = (totalBytes ? doneBytes/totalBytes*100 : 100) + '%';
      $('sFiles').textContent = `${done}/${total}`;
      $('sSize').textContent = fmtMB(doneBytes);
      $('sSpeed').textContent = fmtMB(doneBytes / Math.max((performance.now()-t0)/1000, .1)) + '/s';
    };

    async function worker(){
      while (idx < files.length){
        const file = files[idx++];
        const rel = file.webkitRelativePath || file.name;
        const path = (prefix ? `${prefix}/${rel}` : rel)
          .replace(/\\/g, '/').replace(/\/{2,}/g, '/').replace(/^(\.\/|\/)+/, '');
        try{
          const buf = await file.arrayBuffer();
          const sha = await gitSha(buf);
          if (existing.get(path) === sha){
            skipped++; log(`Skipped (unchanged): ${path}`);
          } else {
            const blob = await gh(pat, `${base}/git/blobs`, {
              method: 'POST',
              body: JSON.stringify({ content: toBase64(buf), encoding: 'base64' })
            });
            entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            uploaded++; log(`Uploaded: ${path}`, 'success');
          }
        }catch(e){
          failed++; log(`Failed: ${path} — ${e.message}`, 'error');
        }
        done++; doneBytes += file.size; render();
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, files.length) }, worker));

    // 3. One commit for everything
    if (entries.length){
      // Remove duplicate paths, then build the tree in small chunks (avoids timeouts)
      const unique = [...new Map(entries.map(n => [n.path, n])).values()];
      let treeSha = parent.tree.sha;
      const CHUNK = 100;
      for (let i = 0; i < unique.length; i += CHUNK){
        step = `tree ${Math.min(i + CHUNK, unique.length)}/${unique.length}`;
        log(`Building ${step}…`);
        const t = await gh(pat, `${base}/git/trees`, {
          method: 'POST', body: JSON.stringify({ base_tree: treeSha, tree: unique.slice(i, i + CHUNK) })
        });
        treeSha = t.sha;
      }
      step = 'commit';
      log('Creating commit…');
      const commit = await gh(pat, `${base}/git/commits`, {
        method: 'POST',
        body: JSON.stringify({ message: `Add ${unique.length} comic files via Comic Uploader`, tree: treeSha, parents: [parentSha] })
      });
      step = 'branch update';
      await gh(pat, `${base}/git/refs/heads/${encodeURIComponent(branch)}`, {
        method: 'PATCH', body: JSON.stringify({ sha: commit.sha })
      });
      step = '';
    }
    const secs = ((performance.now()-t0)/1000).toFixed(1);
    log(`Done in ${secs}s — ${uploaded} uploaded, ${skipped} skipped, ${failed} failed.`, failed ? 'error' : 'success');
  }catch(e){
    let hint = '';
    if (e.status === 401) hint = ' Token is invalid or expired.';
    else if (e.status === 403 || e.status === 404) hint = ' Check that the token has Contents read/write access to this repo, and the names are correct.';
    else if (e.status === 409) hint = ' The repo may be empty. Add a README on GitHub first, then retry.';
    if (e.status === 422) hint = ' GitHub rejected the data. Check file/folder names for odd characters.';
    log(`Error${step ? ' at ' + step : ''}: ${e.message}.${hint}`, 'error');
  }
  $('uploadBtn').disabled = false; $('uploadBtn').textContent = 'Start upload';
};
</script>
</body>
</html>
