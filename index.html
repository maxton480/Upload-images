<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast GitHub Comic Uploader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="password"], input[type="file"] {
            width: 100%; padding: 10px; box-sizing: border-box;
            background: #222; border: 1px solid #444; color: #fff; border-radius: 4px;
        }
        button {
            width: 100%; padding: 12px; background-color: #2ea043; color: white;
            border: none; border-radius: 4px; font-size: 16px; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        button:hover { background-color: #2c974b; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #log {
            margin-top: 20px; background: #0d1117; padding: 15px;
            height: 350px; overflow-y: auto; font-family: monospace;
            border: 1px solid #30363d; border-radius: 4px; font-size: 13px;
        }
        .success { color: #3fb950; }
        .error { color: #f85149; }
        .info { color: #58a6ff; }
        .warning { color: #d29922; }
    </style>
</head>
<body>

    <h2>Fast Comic Uploader for GitHub</h2>

    <div class="input-group">
        <label for="pat">GitHub Personal Access Token (PAT) <span style="font-size:12px; font-weight:normal; color:#8b949e;">(Auto-saved)</span></label>
        <input type="password" id="pat" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>

    <div class="input-group">
        <label for="folderInput">Select Main Folder</label>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </div>

    <button id="uploadBtn">Start Fast Upload</button>

    <div id="log">Ready to upload...<br><br></div>

    <script>
        const repoOwner = "maxton480";
        const repoName = "comics";
        const BATCH_SIZE = 5; // Ek sath 5 images upload hogi (speed ke liye)
        
        const logDiv = document.getElementById('log');
        const uploadBtn = document.getElementById('uploadBtn');
        const patInput = document.getElementById('pat');

        // PAT Key Save & Load logic
        window.addEventListener('DOMContentLoaded', () => {
            const savedPat = localStorage.getItem('github_pat_comics');
            if (savedPat) patInput.value = savedPat;
        });

        patInput.addEventListener('input', (e) => {
            localStorage.setItem('github_pat_comics', e.target.value.trim());
        });

        function addLog(msg, type = "info") {
            const span = document.createElement('div');
            span.className = type;
            span.textContent = msg;
            logDiv.appendChild(span);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function uploadSingleFile(file, pat) {
            const filePath = file.webkitRelativePath;
            try {
                const contentBase64 = await toBase64(file);
                
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${pat}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `Upload ${filePath}`,
                        content: contentBase64
                    })
                });

                if (response.status === 201 || response.status === 200) {
                    addLog(`[Success] ${filePath}`, "success");
                } else if (response.status === 422) {
                    addLog(`[Skipped] ${filePath} (Already exists)`, "warning");
                } else {
                    const err = await response.json();
                    addLog(`[Failed] ${filePath} - ${err.message}`, "error");
                }
            } catch (error) {
                addLog(`[Error] ${filePath}: ${error.message}`, "error");
            }
        }

        uploadBtn.addEventListener('click', async () => {
            const pat = patInput.value.trim();
            const rawFiles = document.getElementById('folderInput').files;

            if (!pat) {
                addLog("Error: Please enter your GitHub Token.", "error");
                return;
            }
            if (rawFiles.length === 0) {
                addLog("Error: Please select a folder first.", "error");
                return;
            }

            // Hidden/system files ko filter karna (like .DS_Store)
            const files = Array.from(rawFiles).filter(f => !f.name.startsWith('.'));

            uploadBtn.disabled = true;
            uploadBtn.textContent = `Uploading ${files.length} files...`;
            addLog(`Found ${files.length} valid files. Starting batch upload (${BATCH_SIZE} at a time)...`);

            // Batch Processing loop
            for (let i = 0; i < files.length; i += BATCH_SIZE) {
                const batch = files.slice(i, i + BATCH_SIZE);
                addLog(`Processing batch ${Math.floor(i/BATCH_SIZE) + 1}...`, "info");
                
                // Batch mein sabhi files ko ek sath upload pe lagana
                const uploadPromises = batch.map(file => uploadSingleFile(file, pat));
                await Promise.all(uploadPromises);
            }

            addLog("All Uploads Completed!", "success");
            uploadBtn.disabled = false;
            uploadBtn.textContent = "Start Fast Upload";
            document.getElementById('folderInput').value = ""; // Reset file input
        });
    </script>
</body>
</html>
